name: Push GitHub Trending

on:
  schedule:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 推送频率配置（修改下面这行 cron 表达式即可）
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    #
    # ⚠️ cron 使用 UTC 时间，北京时间 = UTC + 8
    #    当前 "0 1 * * *" → UTC 01:00 = 北京时间 09:00
    #
    # 📝 常用示例：
    #    北京 08:00 → "0 0 * * *"      北京 12:00 → "0 4 * * *"
    #    北京 18:00 → "0 10 * * *"     北京 21:00 → "0 13 * * *"
    #
    # ⚠️ GitHub Actions 限制：cron 必须是 YAML 字面量，
    #    无法从 config.yaml 或环境变量读取，请在下方直接修改
    #
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: push-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run pusher
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WECHAT_SENDKEY: ${{ secrets.WECHAT_SENDKEY }}
        run: uv run python -m src

[project]
name = "trends-pusher"
version = "0.1.0"
description = "多源热榜聚合推送：GitHub Trending / Hacker News / 掘金 / Product Hunt / 牛客 → 飞书、微信"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ═══════════════════════════════════════════════
#   GitHub Trends Pusher 配置文件
# ═══════════════════════════════════════════════

# 注意：推送频率（cron 表达式）在 .github/workflows/push.yml 中修改
# GitHub Actions 限制 schedule 的 cron 必须是 YAML 字面量，无法从配置文件读取

# 抓取配置
crawler:
  github:
    since: "daily"           # daily / weekly / monthly
    language: ""             # 留空=全部语言，可选 python/go/javascript/...
    spoken_language: ""      # 留空=全部，可选 zh/en/...

# 展示配置
display:
  max_items: 25
  show_language_color: true
  show_description: true

# 通知渠道（webhook_url / sendkey 有值即启用，空字符串则不启用）
notification:
  feishu:
    webhook_url: ""
    secret: ""
  wechat:
    sendkey: ""
